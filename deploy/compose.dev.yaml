# Dev stack. Start it with `mise run dev`. The data volume starts empty, so
# HomeProxy starts in setup mode; `mise run dev -- seed` fills it with the
# example config.
#
# Host ports are fixed and bind 127.0.0.1:
#   8080  HAProxy HTTP       8443  HAProxy HTTPS
#   8000  dashboard API      3000  Nuxt dev server
#   5335  internal DNS (UDP and TCP)
# The container ports are the ones the setup wizard detects: 80, 443 and 8443.
#
# The network has a fixed subnet, 10.203.21.0/24, and homeproxy a fixed
# address, 10.203.21.4. Setup saves that address into network.haproxy_lan_ip
# and dns_server.listen, so a recreate must not move it. The subnet is outside
# Docker's default pools (172.17.0.0 to 172.31.255.255, and 192.168.0.0/16),
# so with those pools no other compose project gets it while this stack is
# down. It also avoids the 10.0.x and 10.1.x ranges that home routers use.
# The test backends are pinned too.
# The other containers get addresses from 10.203.21.128/25 and never take a
# pinned one.

x-homeproxy-image: &homeproxy-image
  image: homeproxy-dev

services:
  homeproxy:
    <<: *homeproxy-image
    build:
      context: ..
      dockerfile: image/Dockerfile
      target: dev
    networks:
      default:
        ipv4_address: 10.203.21.4
    # HAProxy needs NET_BIND_SERVICE, which Docker grants by default.
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8000:8443"
      - "127.0.0.1:5335:5335/udp"
      - "127.0.0.1:5335:5335/tcp"
    environment:
      HOMEPROXY_BOOTSTRAP_LISTEN: "0.0.0.0:8443"
      # Certificates stay self-signed. Set to 0 to use Let's Encrypt staging
      # with a test zone.
      HOMEPROXY_DEV_SELF_SIGNED: "${HOMEPROXY_DEV_SELF_SIGNED:-1}"
      # A fake newer release for the HomeProxy update check (N-12).
      HOMEPROXY_UPDATE_URL: "file:///etc/homeproxy/dev-release.json"
    # Guard rails: even if a setting turns Cloudflare or production ACME on,
    # these names resolve to the container itself (IPv4 and IPv6), so nothing real is called.
    extra_hosts:
      - "api.cloudflare.com=127.0.0.1"
      - "api.cloudflare.com=::1"
      - "acme-v02.api.letsencrypt.org=127.0.0.1"
      - "acme-v02.api.letsencrypt.org=::1"
    volumes:
      - data:/data
      - ../backend/homeproxy:/opt/homeproxy/src/homeproxy:ro
    configs:
      - source: homeproxy_dev_release
        target: /etc/homeproxy/dev-release.json
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import os,urllib.request as u; u.urlopen('http://127.0.0.1:' + os.environ['HOMEPROXY_BOOTSTRAP_LISTEN'].rsplit(':', 1)[1] + '/api/v1/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  # One-shot: empties the data volume and copies a seed directory into it.
  # `mise run dev -- seed` runs it with `docker compose run` on a stopped stack,
  # after generating the seed (image/dev/make-seed) into HOMEPROXY_DEV_SEED_DIR.
  # A plain `up` never starts it.
  seed:
    <<: *homeproxy-image
    pull_policy: never
    profiles: [seed]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        find /data -mindepth 1 -delete
        install -d -m 0755 /data/config /data/config/routes
        cp -r /seed/config/. /data/config/
        install -d -m 0700 /data/secrets
        install -m 0600 /seed/secrets/secrets.yaml /data/secrets/secrets.yaml
        # The API runs as homeproxy and must own what it reads and rewrites.
        chown -R homeproxy:homeproxy /data/config /data/secrets
        echo "seed: replaced /data with the example config"
    volumes:
      - data:/data
      - ${HOMEPROXY_DEV_SEED_DIR:-/nonexistent}:/seed:ro

  ui:
    build:
      context: ..
      dockerfile: image/Dockerfile
      target: ui-dev
    image: homeproxy-dev-ui
    # Run as the host user so files written into frontend/ stay yours.
    user: "${HOMEPROXY_DEV_UID:-1000}:${HOMEPROXY_DEV_GID:-1000}"
    command:
      - sh
      - -c
      - pnpm install --frozen-lockfile && exec pnpm exec nuxt dev --host 0.0.0.0 --port 3000
    environment:
      HOMEPROXY_DEV_API: "http://homeproxy:8443"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../frontend:/app
      - ui_node_modules:/app/node_modules
      # A private .nuxt: a Nuxt command on the host (install, check, build)
      # cleans the shared directory under the running dev server and breaks
      # `#app-manifest`. The dev server rebuilds it on every start.
      - type: tmpfs
        target: /app/.nuxt
        tmpfs:
          mode: 0777
      - ui_pnpm_store:/pnpm-store
    depends_on:
      homeproxy:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  # CrowdSec engine for the HAProxy collection. It shares the homeproxy
  # container's network, as the engine shares the host network in production,
  # so homeproxy reaches the LAPI (8080) and the syslog acquisition (514) on
  # 127.0.0.1. HAProxy needs an IP for its log target: a name that does not
  # resolve stops it from starting. Nothing is published. It runs on empty
  # volumes too: the bouncer key and the dashboard's machine login are the
  # fixed dev values from the example secrets.yaml, and nothing uses them until
  # crowdsec is enabled. /etc/crowdsec is a volume, as CrowdSec's Docker guide
  # requires: it holds the hub and the engine's own credentials. The AppSec
  # component listens on 127.0.0.1:7422, where the bouncer looks for it while
  # `crowdsec.appsec` is on.
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.2@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4
    network_mode: "service:homeproxy"
    environment:
      COLLECTIONS: crowdsecurity/haproxy crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      BOUNCER_KEY_homeproxy: fake-bouncer-key  # crowdsec.bouncer_key in examples/data secrets.yaml
      # The image registers this machine again on every start, so a changed password applies on restart.
      AGENT_USERNAME: homeproxy-ui  # crowdsec.machine_id in examples/data secrets.yaml
      AGENT_PASSWORD: fake-machine-password  # crowdsec.machine_password
      # No Central API and no community blocklist. The hub still downloads the collections.
      DISABLE_ONLINE_API: "true"
    configs:
      - source: crowdsec_acquis
        target: /etc/crowdsec/acquis.d/haproxy.yaml
      - source: crowdsec_appsec
        target: /etc/crowdsec/acquis.d/appsec.yaml
      - source: crowdsec_unknown_host
        target: /etc/crowdsec/scenarios/homeproxy-unknown-host.yaml
    volumes:
      - crowdsec_config:/etc/crowdsec
      - crowdsec_data:/var/lib/crowdsec/data
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  # Test backends, named in examples/data/config/routes/whoami.yaml.
  whoami-a:
    image: traefik/whoami:v1.11.0@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
    networks:
      default:
        ipv4_address: 10.203.21.3
    restart: unless-stopped

  whoami-b:
    image: traefik/whoami:v1.11.0@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
    networks:
      default:
        ipv4_address: 10.203.21.2
    restart: unless-stopped

configs:
  homeproxy_dev_release:
    content: |
      {"tag_name": "v9.9.9", "html_url": "https://example.com/releases/v9.9.9"}
  crowdsec_acquis:
    content: |
      source: syslog
      listen_addr: 0.0.0.0
      listen_port: 514
      # HAProxy sends lines of up to 4096 bytes. The default, 2048, leaves long lines unparsed.
      max_message_len: 4096
      labels:
        type: syslog
  crowdsec_unknown_host:
    content: |
      # HomeProxy answers a host that no route serves from its be_unknown_host backend. Real
      # visitors never ask for one, but scanners ask for the bare IP, a random name or no name.
      # The second such request in about 10 minutes bans the client. A browser also asks for
      # /favicon.ico after the page, so that request does not count.
      type: leaky
      name: homeproxy/unknown-host
      description: "Ban a client that asks twice for a host that HomeProxy does not serve"
      filter: "evt.Meta.log_type == 'http_access-log' && evt.Parsed.backend_name == 'be_unknown_host' && evt.Meta.http_path != '/favicon.ico'"
      groupby: evt.Meta.source_ip
      capacity: 1
      leakspeed: 10m
      blackhole: 1m
      labels:
        service: http
        confidence: 3
        spoofable: 0
        classification:
          - attack.T1595
        behavior: "http:scan"
        label: "Request for an unknown host"
        remediation: true
  crowdsec_appsec:
    content: |
      source: appsec
      appsec_configs:
        - crowdsecurity/appsec-default
      listen_addr: 127.0.0.1:7422
      labels:
        type: appsec

networks:
  default:
    ipam:
      config:
        - subnet: 10.203.21.0/24
          gateway: 10.203.21.1
          # Dynamic addresses come only from here, away from the pinned ones.
          ip_range: 10.203.21.128/25

volumes:
  data:
  ui_node_modules:
  ui_pnpm_store:
  crowdsec_config:
  crowdsec_data:
