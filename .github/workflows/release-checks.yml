name: release-checks

# Only for PRs into main, so the job never exists as a skipped check, which
# GitHub would count as passed. The main ruleset requires it.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release PR (dev into main) must carry a new version and pass the container
  # and browser tests, because merging it publishes that version.
  release-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.9.7
      - name: Release PR comes from dev with a new version
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != dev ]; then
            echo "a PR into main must come from dev, not $HEAD_REF" >&2
            exit 1
          fi
          version=$(yq -p toml -oy '.project.version' backend/pyproject.toml)
          # The checkout has no tags, so read them from the remote.
          released=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||')
          if printf '%s\n' "$released" | grep -qxF "$version"; then
            echo "v$version is already released: run mise run bump on dev" >&2
            exit 1
          fi
          latest=$(printf '%s\n' "$released" | sort -V | tail -n 1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)" != "$version" ]; then
            echo "v$version is not above the latest release v$latest" >&2
            exit 1
          fi
          echo "releasing v$version"
      # Each builds and smoke-tests the image first; the second build comes from the cache.
      - name: Integration tests
        run: mise run test-integration
      - name: End-to-end tests
        run: mise run test-e2e
