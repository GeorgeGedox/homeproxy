name: release-checks

# Only for PRs into main, so the job never exists as a skipped check, which
# GitHub would count as passed. The main ruleset requires it, beside the ci jobs
# of the push run on dev for the same commit.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release PR (dev into main) must carry a new version, because merging it
  # publishes that version, and the version must be big enough for its commits.
  # It runs again on every push to the PR, so a feat that lands while a patch
  # release waits to auto-merge fails it.
  release-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The version guard reads the commits and tags since the last release.
          # fetch-tags is explicit: without tags, every check below would pass as
          # if this were the first release.
          fetch-depth: 0
          fetch-tags: true
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.9.7
      - name: The release PR has a new version that fits its commits
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != dev ]; then
            echo "a PR into main must come from dev, not $HEAD_REF" >&2
            exit 1
          fi
          version=$(yq -p toml -oy '.project.version' backend/pyproject.toml)
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1 | sed 's/^v//')
          if git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released: run mise run bump on dev" >&2
            exit 1
          fi
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)" != "$version" ]; then
            echo "v$version is not above the latest release v$latest" >&2
            exit 1
          fi

          kind=$(mise run --quiet release-kind)
          if [ -n "$latest" ] && [ "${version%.*}" = "${latest%.*}" ] && { [ "$kind" = minor ] || [ "$kind" = breaking ]; }; then
            echo "v$version is a patch release, but the commits since v$latest call for $kind" >&2
            exit 1
          fi
          echo "releasing v$version; the commits call for: $kind"
