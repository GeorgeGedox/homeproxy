name: release

# A merge into main publishes the version in backend/pyproject.toml: the amd64
# image to GHCR as X.Y.Z and latest, then the GitHub release vX.Y.Z, which the
# HomeProxy update check reads. Only a release PR from dev can change main, and
# its required checks ran the full test suite. One workflow creates the tag and
# publishes, because a tag that GITHUB_TOKEN creates starts no other workflow.
on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release notes need the commits and tags since the last release.
          fetch-depth: 0
          fetch-tags: true
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.9.7
      - name: Read the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(yq -p toml -oy '.project.version' backend/pyproject.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # Before the image push, so a failure here publishes nothing.
      - name: Write the release notes
        if: steps.version.outputs.publish == 'true'
        run: mise run --quiet release-notes > "$RUNNER_TEMP/notes.md"
      - name: Build and smoke-test the image
        if: steps.version.outputs.publish == 'true'
        run: mise run image
      - name: Push the image
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          src="homeproxy:$(mise exec -- printenv COMPOSE_PROJECT_NAME)"
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$VERSION" latest; do
            docker tag "$src" "$repo:$tag"
            docker push "$repo:$tag"
          done
      - name: Create the GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
