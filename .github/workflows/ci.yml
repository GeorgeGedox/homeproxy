name: ci

# Every push to dev and every PR into dev runs the full suite, so a broken dev shows up the day it
# breaks and Renovate merges only what passed. A release PR (dev into main) needs no run of its
# own: main takes only merges from dev, and the checks of the push run on the same commit count
# for it. The main ruleset requires these jobs by name.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.9.7
      # Before check: its .pyc files keep the fake test keys but drop the gitleaks:allow comments.
      - name: Scan for secrets
        run: gitleaks dir --no-banner --redact
      - name: Check
        run: mise run check

  # The image suites run on each architecture, each on its own native runner. They wait for check,
  # which looks at the code and runs once.
  test:
    needs: check
    name: ${{ matrix.suite }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        suite: [integration, e2e]
        arch: [amd64, arm64]
    # Renovate does not see runner names in an expression: change these with its runner OS PR.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.9.7
      - name: Run the suite
        env:
          SUITE: ${{ matrix.suite }}
        run: mise run "test-$SUITE"
