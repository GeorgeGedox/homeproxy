[project]
name = "homeproxy"
version = "0.1.0"
description = "Self-hosted reverse proxy manager built on HAProxy"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "apscheduler==3.11.3",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "dnspython==2.9.2",
    "fastapi==0.136.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "libpass==1.9.3",
    "pydantic==2.14.3",
    "ruamel.yaml==0.19.1",
    "uvicorn==0.46.0",
]

[project.scripts]
homeproxy = "homeproxy.cli:main"

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy==1.20.2",
    "pytest==9.0.3",
    "pytest-xdist==3.8.0",
    "ruff==0.15.12",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homeproxy"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "C90", "PLR0912", "PLR0915", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"urllib.request.urlopen".msg = "Use homeproxy.util.http.urlopen, which sends HomeProxy's user agent."

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/integration/**" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["homeproxy", "tests"]

[[tool.mypy.overrides]]
# APScheduler 3.x ships no type hints. homeproxy.jobs wraps it in a typed API.
module = ["apscheduler", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# libpass ships no type hints. homeproxy.store.basic_auth wraps its one call.
module = ["passlib", "passlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need Docker and the built image. `mise run test-integration`
# selects them with `-m integration`, which overrides the default below.
# Benchmarks depend on the machine's speed, so no default run includes them.
addopts = "-ra --strict-markers --import-mode=importlib -m 'not integration and not bench'"
markers = [
    "integration: runs against the built image in compose (mise run test-integration)",
    "bench: timing benchmark, run on demand with `uv run pytest -m bench`",
]
