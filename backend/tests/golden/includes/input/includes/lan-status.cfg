# Hand-written by the admin. Non-ASCII text such as "Grüße" must survive the copy.
# A relative path here reads the release's own list, like the generated files do.
frontend lan_status
    bind 127.0.0.1:8404
    http-request deny deny_status 403 if !{ src -f lan.lst }
    http-request return status 200 content-type text/plain string "ok"
