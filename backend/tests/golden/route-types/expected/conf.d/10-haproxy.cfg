# Generated by HomeProxy. Do not edit: the next apply replaces this file.
global
    # Relative paths resolve from the release directory, the parent of conf.d/.
    default-path parent
    # Access lines go to the dashboard's log collector.
    # A target that is not listening loses lines. HAProxy keeps serving.
    log /run/homeproxy/syslog.sock len 4096 format rfc5424 local0 info
    # The container log gets startup and server state messages, not access lines.
    log stdout format raw local0 notice
    # HAProxy runs as the same user as the API, so this section has no user or group.
    stats socket /run/haproxy/admin.sock mode 600 level admin expose-fd listeners
    server-state-file /data/state/haproxy-server-state
    # New servers get their first check within a second, so the apply can report a dead upstream.
    max-spread-checks 1s
    # Long-lived WebSockets must not keep old workers forever after a reload.
    hard-stop-after 30m
    maxconn 10000

# TCP frontends and backends use `from tcp`. Every other section uses the HTTP defaults below.
defaults tcp
    mode tcp
    log global
    # HAProxy's default tcplog fields, then the route, the country code and the URL-encoded SNI.
    log-format "%ci:%cp [%t] %ft %b/%s %Tw/%Tc/%Tt %B %ts %ac/%fc/%bc/%sc/%rc %sq/%bq %{+Q}[var(txn.route)] %{+Q}[var(txn.country)] %{+Q}[var(txn.sni),url_enc]"
    # No `dontlognull`: a client of SSH or another protocol where the server speaks first sends
    # nothing before it is refused, and that refusal must still be logged.
    load-server-state-from-file global
    default-server init-addr libc,none
    timeout connect 5s
    timeout client 60s
    timeout server 300s
    # Once connected, an idle SSH session, passthrough console or WebSocket behind the SNI layer
    # stays open this long.
    timeout tunnel 1h
    timeout check 5s

defaults
    mode http
    log global
    # HAProxy's default httplog fields, which the CrowdSec HAProxy parser expects, then the route,
    # the country code and the URL-encoded SNI. The client sends the SNI, so it is encoded.
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs %{+Q}r %{+Q}[var(txn.route)] %{+Q}[var(txn.country)] %{+Q}[ssl_fc_sni,url_enc]"
    option dontlognull
    option forwardfor
    load-server-state-from-file global
    # A name that does not resolve disables its server. It must not stop HAProxy from starting.
    # No `last`: it would keep the address from the state file, not the name's new DNS answer.
    default-server init-addr libc,none
    timeout connect 5s
    timeout http-request 10s
    timeout http-keep-alive 30s
    timeout client 60s
    timeout server 300s
    timeout check 5s

# Plain HTTP arrives here too. It moves to HTTPS, except on a redirect route's hosts and on routes
# in a domain with no certificate, which pass the same checks as HTTPS before they answer.
frontend fe_https
    # With a passthrough route, the SNI layer owns the HTTPS port and hands every other connection
    # to this socket, with the client's address in a PROXY header.
    bind unix@/run/haproxy/https.sock mode 600 accept-proxy ssl default-crt /data/certs/default.pem crt /data/certs/ alpn h2,http/1.1
    bind *:80
    # A client must not be able to tell the upstream where it came from.
    http-request del-header ^x[-_]forwarded[-_](for|host|port|proto)$ -m reg
    http-request del-header ^x[-_]real[-_]ip$ -m reg
    http-request del-header Forwarded
    http-request set-header X-Forwarded-Proto %[ssl_fc,iif(https,http)]
    # The backend is looked up once. The LAN check, HSTS and redirects are keyed by backend, so they
    # always apply to the backend that serves the request, whatever host led to it.
    http-request set-var(txn.host) req.hdr(host),host_only,lower
    http-request set-var(txn.backend) var(txn.host),map(hosts.map)
    # A host with routes on different paths is looked up with its path, as "<host><prefix>/", and
    # the longest prefix wins. The "/" after the path ends a prefix on a segment boundary. The path
    # is decoded, ";" parameters are dropped and slashes merged, so "/%61pi", "/api;x" or "//api"
    # cannot reach another route than "/api" does. A path that does not decode, or that holds a "."
    # or ".." segment, gets 400. Browsers never send one.
    http-request set-var(txn.path_dec) path,url_dec,regsub(;[^/]*,,g),regsub(/+,/,g) if !{ var(txn.backend) -m found }
    http-request deny deny_status 400 if !{ var(txn.backend) -m found } !{ var(txn.path_dec) -m found }
    http-request set-var-fmt(txn.path_key) "%[var(txn.host)]%[var(txn.path_dec)]/" if !{ var(txn.backend) -m found }
    http-request deny deny_status 400 if { var(txn.path_key) -m sub /./ /../ }
    http-request set-var(txn.backend) var(txn.path_key),map_beg(paths.map) if !{ var(txn.backend) -m found }
    # The real client comes next, so every later rule and the access log see it. Only Cloudflare's
    # edge may name it, in CF-Connecting-IP, which can be IPv6, and only on a route your zone
    # proxies: a Worker on any account can send any value to a host it reaches directly. The backend
    # lookup above reads no address. A value that is not one address leaves the edge's address in
    # place. Elsewhere the header is removed.
    http-request set-var(txn.from_cf) bool(1) if { src -f cloudflare.lst } { var(txn.backend),map_str_int(proxied-only.map) -m found }
    http-request set-src req.fhdr(cf-connecting-ip) if { var(txn.from_cf) -m bool }
    # Header names arrive in lower case. Some upstreams read `_` as `-`, so both spellings go.
    http-request del-header ^cf[-_]connecting[-_]ip$ -m reg if !{ var(txn.from_cf) -m bool }
    # The country is looked up once, so the block below and the access log agree. The map holds
    # only blocked countries. ZZ marks an address with no blocked country and is logged as empty;
    # the log collector then adds its country from the full data.
    http-request set-var(txn.country) src,map_ip(country.map)
    http-request unset-var(txn.country) if { var(txn.country) -m str ZZ }
    # A route in a domain with no certificate is served over plain HTTP only. On HTTPS its host
    # gets 404, and never another domain's route.
    acl plain_http_route var(txn.backend),map_str_int(plain-http.map) -m found
    http-request set-var(txn.backend) str(be_not_found) if { ssl_fc } plain_http_route
    # A redirect route's entry is "<code>|<keep path>|<target>".
    http-request set-var(txn.redirect) var(txn.backend),map(redirect.map)
    acl redirect_host var(txn.redirect) -m found
    http-request redirect location https://%[req.hdr(host),host_only]%[pathq] code 301 if !{ ssl_fc } !redirect_host !plain_http_route { var(txn.host) -m found }
    http-request deny deny_status 400 if !{ ssl_fc } !redirect_host !plain_http_route
    http-request set-var(txn.route) var(txn.backend),regsub(^route-,) if { var(txn.backend) -m beg route- }
    # A browser may reuse a connection for another host that the certificate covers. A passthrough
    # host belongs to its own server, so 421 tells the browser to connect again.
    http-request deny deny_status 421 if { var(txn.host),map(sni.map) -m found }
    # A blocked country gets a plain 403 on a public route. LAN clients are never blocked.
    http-request deny deny_status 403 if { var(txn.backend),concat(/,txn.country),map_str_int(country-block.map) -m found } !{ src -f lan.lst }
    http-request deny deny_status 403 if { var(txn.backend),map_str_int(lan-only.map) -m found } !{ src -f lan.lst }
    # A route that Cloudflare proxies cannot be reached around it, except from the LAN.
    http-request deny deny_status 403 if { var(txn.backend),map_str_int(proxied-only.map) -m found } !{ var(txn.from_cf) -m bool } !{ src -f lan.lst }
    # A redirect route answers here, after every check. Its backend does not exist.
    http-request set-var(txn.redirect_pathq) pathq if { var(txn.redirect),field(2,|) -m str 1 }
    http-request redirect location %[var(txn.redirect),field(3,|,0)]%[var(txn.redirect_pathq)] code 301 if { var(txn.redirect),field(1,|) -m str 301 }
    http-request redirect location %[var(txn.redirect),field(3,|,0)]%[var(txn.redirect_pathq)] code 302 if { var(txn.redirect),field(1,|) -m str 302 }
    http-request redirect location %[var(txn.redirect),field(3,|,0)]%[var(txn.redirect_pathq)] code 307 if { var(txn.redirect),field(1,|) -m str 307 }
    http-request redirect location %[var(txn.redirect),field(3,|,0)]%[var(txn.redirect_pathq)] code 308 if { var(txn.redirect),field(1,|) -m str 308 }
    http-response set-header Strict-Transport-Security "max-age=31536000" if { var(txn.backend),map_str_int(hsts.map) -m found } !{ res.hdr(strict-transport-security) -m found }
    # Plain HTTP reaches only the backend of a route in a domain with no certificate. A redirect
    # host has answered above.
    http-request deny deny_status 400 if !{ ssl_fc } !plain_http_route
    # A host that no route serves leaves the name empty, so the request goes to the default backend.
    use_backend %[var(txn.backend)]
    default_backend be_unknown_host

# The SNI layer only routes. Passthrough hosts go to fe_passthrough, everything else to fe_https.
# Both get the client's address in a PROXY header, and both check and log the connection.
frontend fe_sni from tcp
    bind *:443
    tcp-request content set-log-level silent
    # The TLS hello names the host. A connection without one within 5 s goes to fe_https.
    tcp-request inspect-delay 5s
    tcp-request content set-var(txn.backend) req.ssl_sni,lower,map(sni.map) if { req.ssl_sni -m found }
    use_backend be_passthrough if { var(txn.backend) -m found }
    default_backend be_https

backend be_https from tcp
    server https unix@/run/haproxy/https.sock send-proxy-v2

backend be_passthrough from tcp
    server passthrough unix@/run/haproxy/passthrough.sock send-proxy-v2

# The SNI layer has already read the whole hello and sends it at once, so the checks here get a
# fresh 5 s. Within fe_sni, a hello sent late would leave the CrowdSec check no time.
frontend fe_passthrough from tcp
    bind unix@/run/haproxy/passthrough.sock mode 600 accept-proxy
    tcp-request inspect-delay 5s
    tcp-request content set-var(txn.sni) req.ssl_sni if { req.ssl_sni -m found }
    tcp-request content set-var(txn.backend) var(txn.sni),lower,map(sni.map)
    tcp-request content set-var(txn.route) var(txn.backend),regsub(^route-,)
    # The source is the real client, from the connection or from the SNI layer's PROXY header.
    # The rules match fe_https, keyed by the same backend names.
    tcp-request content set-var(txn.country) src,map_ip(country.map)
    tcp-request content unset-var(txn.country) if { var(txn.country) -m str ZZ }
    tcp-request content reject if { var(txn.backend),concat(/,txn.country),map_str_int(country-block.map) -m found } !{ src -f lan.lst }
    tcp-request content reject if { var(txn.backend),map_str_int(lan-only.map) -m found } !{ src -f lan.lst }
    use_backend %[var(txn.backend)]

# `tcp` routes, each on its own port.
frontend fe_tcp from tcp
    bind *:2222
    bind *:25565
    tcp-request content set-var(txn.backend) str(route-ssh) if { dst_port 2222 }
    tcp-request content set-var(txn.backend) str(route-tcp) if { dst_port 25565 }
    tcp-request content set-var(txn.route) var(txn.backend),regsub(^route-,)
    # The source is the real client, from the connection or from the SNI layer's PROXY header.
    # The rules match fe_https, keyed by the same backend names.
    tcp-request content set-var(txn.country) src,map_ip(country.map)
    tcp-request content unset-var(txn.country) if { var(txn.country) -m str ZZ }
    tcp-request content reject if { var(txn.backend),concat(/,txn.country),map_str_int(country-block.map) -m found } !{ src -f lan.lst }
    tcp-request content reject if { var(txn.backend),map_str_int(lan-only.map) -m found } !{ src -f lan.lst }
    use_backend %[var(txn.backend)]
