# A host that a route serves, on a path or a port that no route answers.
backend be_not_found
    http-request deny deny_status 404

# A host that no route serves, such as the bare IP. The CrowdSec scenario in `docs/crowdsec.md`
# counts these requests, so a real visitor must never get here.
backend be_unknown_host
    http-request deny deny_status 404

backend route-encoded-format
    option httpchk
    http-check send meth GET uri "/%25?a=%5B&b=%&c=+" ver HTTP/1.1 hdr Host format.example.com
    server 192.168.1.20:8080 192.168.1.20:8080 check inter 10s

backend route-encoded-newline
    option httpchk
    http-check send meth GET uri "/%0a" ver HTTP/1.1 hdr Host newline.example.com
    server 192.168.1.20:8080 192.168.1.20:8080 check inter 10s

backend route-encoded-nul
    option httpchk
    http-check send meth GET uri "/%00" ver HTTP/1.1 hdr Host nul.example.com
    server 192.168.1.20:8080 192.168.1.20:8080 check inter 10s
