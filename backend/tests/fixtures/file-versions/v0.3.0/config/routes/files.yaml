# A LAN-only http route with basic auth. The hash is in secrets.yaml under basic_auth.files.
version: 1
name: files
type: http
hosts: [files.example.net]
exposure: lan
upstreams:
  - address: whoami-b:80
tls_upstream: {enabled: false, verify: true}
auth: {type: basic}
dns: {target: 192.168.1.30}
geoip: {block_countries: []}
enabled: true
