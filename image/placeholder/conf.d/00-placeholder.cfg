# First-boot placeholder release. HomeProxy seeds it as /data/releases/placeholder
# and points /data/generated at it until the first apply swaps in a real release.
# Relative paths resolve from the release directory (the parent of conf.d/).
global
    default-path parent
    log stdout format raw local0
    stats socket /run/haproxy/admin.sock mode 600 level admin expose-fd listeners

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend placeholder
    bind ":${HOMEPROXY_PLACEHOLDER_HTTP_PORT}"
    http-request return status 200 content-type "text/html; charset=utf-8" file placeholder.html
